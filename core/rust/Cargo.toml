[package]
name = "spdrop_core"
version = "1.0.0"
edition = "2021"
description = "SpDrop â€” Rust core for zero-loss file transfer with SHA-256 verification"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1"
hex = "0.4"
sanitize-filename = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
flutter_rust_bridge = "=2.12.0"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hkdf = "0.12"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
